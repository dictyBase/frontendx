<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="component-flow-title component-flow-desc" id="component-flow-root">
        <title id="component-flow-title">Toolbar control component flow</title>
        <desc id="component-flow-desc">A user click opens a secondary surface, the control reads editor state through an on-open snapshot or continuous Jotai sync, the surface writes to the Lexical editor, the new state reaches the trigger, and the surface dismisses.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #component-flow-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
      #component-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #component-flow-root .diagram-container { width:100%; overflow-x:auto; }
      @media print {
#component-flow-root .diagram-container { overflow-x:visible; }
}</style>
