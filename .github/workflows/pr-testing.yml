        uses: actions/checkout@v4
      - name: Install Turbo
        run: yarn global add turbo@1.13.3
      - name: Set Up Environment
        run: mv apps/stock-center/.env.development apps/stock-center/.env.production
      - name: Prune Application
        run: yarn turbo prune --scope=stock-center
      - name: Open Output Directory
        run: cd out
      - name: Install Dependencies
        run: yarn install --ignore-engines
      - name: Build Application
        run: yarn turbo run build --filter=stock-center
  build-genomepage:
    needs: test
    name: Build Genome Page
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Check out Code
        uses: actions/checkout@v4
      - name: Install Turbo
        run: yarn global add turbo@1.13.3
      - name: Set Up Environment
        run: mv apps/genomepage/.env.development apps/genomepage/.env.production
      - name: Prune Application
        run: yarn turbo prune --scope=genomepage
      - name: Open Output Directory
        run: cd out
