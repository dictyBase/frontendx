name: Testing (Pull Request)
on: [pull_request, workflow_dispatch]
jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Check out Code
        uses: actions/checkout@v4
      - name: install
        run: yarn install --ignore-engines
      - name: install playwright
        run: yarn playwright install --with-deps
      - name: unit tests
        run: yarn coverage
      - name: upload test coverage to codecov
        uses: codecov/codecov-action@v3
  build-frontpage:
    needs: test
    name: Build Frontpage
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Check out Code
        uses: actions/checkout@v4
      - name: Install Turbo
        run: yarn global add turbo@1.13.3
      - name: Set Up Environment
        run: mv apps/dicty-frontpage/.env.development apps/dicty-frontpage/.env.production
      - name: Prune Application
        run: turbo prune --scope=dicty-frontpage
      - name: Open Output Directory
        run: cd out
      - name: Install Dependencies
        run: yarn install --ignore-engines
      - name: Build Application
        run: yarn turbo run build --filter=dicty-frontpage
  build-stock-center:
    needs: test
    name: Build Stock Center
    runs-on: ubuntu-latest
    steps:
