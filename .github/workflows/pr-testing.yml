        run: yarn install --ignore-engines
      - name: Build Application
        run: yarn turbo run build --filter=genomepage
  build-publication:
    needs: test
    name: Build Publication
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
