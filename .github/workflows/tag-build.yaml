# Template for the service-repo tag workflow.
# Rendered by `just ci render-tag-deploy` — deploy-only: the tag is cut from
# master, which is a pristine fast-forward of develop and has already passed
# lint + test + deploy in ci.yml. Re-running those gates here would duplicate
# the same verification on the same tree, so this workflow only builds,
# publishes and deploys, pointed at a production cluster through the
# <CI_ENV>_* repo variables.
name: Tag Build
on:
  push:
    tags: ['*']

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  call-build-deploy:
    uses: dictyBase/workflows/.github/workflows/composite-deploy.yaml@develop
    secrets: inherit
    with:
      app: frontpage:stockcenter:publication:genomepage
      application_type: frontend
      project: frontend_application
      stack: dcr-kube1
      repository: ${{ github.repository }}
      ref: ${{ github.ref_name }}
      dockerfile: docker/Dockerfile.frontpage:docker/Dockerfile.stock-center:docker/Dockerfile.publication:docker/Dockerfile.genomepage
      docker_image: dicty-frontpage:stock-center:publication:genomepage
      cluster: ${{ vars.PROD_CLUSTER }}
      cluster_state_storage: ${{ vars.PROD_KOPS_STATE_STORAGE }}
      kops_version: ${{ vars.PROD_KOPS_VERSION }}
      kubectl_version: ${{ vars.PROD_KUBECTL_VERSION }}
      pulumi_version: ${{ vars.PROD_PULUMI_VERSION }}
      environment: production
      runner: dcr-frontendx-prod
  postflight:
    name: Production Post-Flight Checks
    needs: call-build-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Check out Code
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: yarn --ignore-engines
      - name: Install Playwright
        run: yarn playwright install --with-deps
      - name: Run E2E Tests
        run: yarn e2e:prod
      - name: Publish Report to Job Summary
        if: always()
        run: |
          if [ -f postflight-report.md ]; then
            cat postflight-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No postflight report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postflight-report
          path: postflight-report.md
          retention-days: 10
          if-no-files-found: ignore
