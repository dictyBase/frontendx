name: runner disk cleanup
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: dcr-frontendx
    steps:
      - name: check disk before
        run: df -h

      - name: prune docker
        run: docker system prune -af --volumes

      - name: clear yarn and other host caches
        run: |
          sudo rm -rf /usr/local/share/.cache/yarn
          sudo rm -rf /home/runner/.cache
          sudo rm -rf /tmp/*
          sudo journalctl --vacuum-size=100M 2>/dev/null || true

      - name: check disk after
        run: df -h
