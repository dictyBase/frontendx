name: Continuous Integration
on:
  push:
    branches:
      - develop
jobs:
  call-deploy:
    uses: dictyBase/workflows/.github/workflows/composite-deploy.yaml@develop
    secrets: inherit
    with:
       project: frontend_application
       stack: experiments
       application_type: frontend
       app: frontpage:stockcenter:publication:genomepage
       repository: ${{ github.repository }}
       ref: ${{ github.ref_name }}
       docker_image: dicty-frontpage:stock-center:publication:genomepage
       dockerfile: docker/Dockerfile.frontpage:docker/Dockerfile.stock-center:docker/Dockerfile.publication:docker/Dockerfile.genomepage
       cluster: ${{ vars.DEV_STAGING_CLUSTER }}
       cluster_state_storage: ${{ vars.DEV_STAGING_KOPS_STATE_STORAGE }}
       runner: dcr-frontendx-beefy
  postflight:
    name: Development Post-Flight Checks
    needs: call-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Check out Code
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: yarn --ignore-engines
      - name: Install Playwright
        run: yarn playwright install --with-deps
      - name: Run E2E Tests
        run: yarn e2e:dev
      - name: Publish Report to Job Summary
        if: always()
        run: |
          if [ -f postflight-report.md ]; then
            cat postflight-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No postflight report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postflight-report
          path: postflight-report.md
          retention-days: 10
          if-no-files-found: ignore
